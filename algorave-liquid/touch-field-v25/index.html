function initAudio(){if(ctx)return true;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Audio unsupported');ctx=new AC();bus=ctx.createGain();bus.gain.value=.85;comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=5;comp.attack.value=.012;comp.release.value=.29;room=ctx.createDelay(.95);room.delayTime.value=.32;roomGain=ctx.createGain();roomGain.gain.value=.12;feedback=ctx.createGain();feedback.gain.value=.17;bus.connect(comp);bus.connect(room);analyser=ctx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.82;frequencyBins=new Uint8Array(analyser.frequencyBinCount);timeBins=new Uint8Array(analyser.fftSize);bus.connect(analyser);room.connect(roomGain);roomGain.connect(comp);room.connect(feedback);feedback.connect(room);comp.connect(ctx.destination);mediaDest=ctx.createMediaStreamDestination();comp.connect(mediaDest);return true}catch(e){$('status').textContent='AUDIO ERROR: '+e.message;return false}}

function testSound(){
 unlockAudio();if(!ctx)return;
 // Short audible diagnostic chord, chosen above the low-frequency rolloff of phone speakers.

 for(const freq of oscs){const o=ctx.createOscillator(),gain=ctx.createGain();o.type='sine';o.frequency.value=freq;gain.gain.setValueAtTime(.0001,t);gain.gain.linearRampToValueAtTime(.072,t+.05);gain.gain.setTargetAtTime(.0001,t+.55,.13);o.connect(gain);gain.connect(bus);o.start(t);o.stop(t+1.3)}

}
// AUDIO button above also plays the test chord; no obsolete TEST SOUND control.
function noteFromX(nx,m){const scale=modes[m].scale;let ix=Math.min(scale.length-1,Math.floor(nx*scale.length));return modes[m].root*Math.pow(2,scale[ix]/12)}
function createAudio(o){if(!initAudio())return;if(ctx.state==='suspended')ctx.resume();const a=ctx.createOscillator(),b=ctx.createOscillator(),f=ctx.createBiquadFilter(),gain=ctx.createGain();const profile=modes[o.mode];a.type=profile.wave;b.type=profile.timbre;f.type='lowpass';f.Q.value=profile.cs80?1.15:.8;gain.gain.value=.0001;
a.connect(f);b.connect(f);f.connect(gain);gain.connect(bus);a.start();b.start();
let harmonic=null,harmonicGain=null;
if(profile.cs80||o.mode==='flow'){harmonic=ctx.createOscillator();harmonicGain=ctx.createGain();harmonic.type=o.mode==='flow'?'sine':'triangle';harmonicGain.gain.value=o.mode==='flow'?.22:o.mode==='abyss'?.16:.11;harmonic.connect(harmonicGain);harmonicGain.connect(f);harmonic.start()}
o.audio={a,b,f,gain,harmonic,harmonicGain};o.bornAudio=ctx.currentTime;updateAudio(o,performance.now(),true)}
function updateAudio(o,now,first=false){if(!ctx||!o.audio)return;const p=sample(o,now),pr=modes[o.mode],nx=p.x,ny=p.y,cycle=(now-o.born)/1000/(pr.loop||8),swell=.73+.27*Math.sin(cycle*Math.PI*2),level=(.038+.11*o.life)*swell*(o.active?1:.82),fq=noteFromX(nx,o.mode),a=o.audio;
 // Nearby organisms slightly detune one another: they modify existing notes, never trigger a new oscillator.
 let proximity=0;
 for(const other of organisms){if(other===o||other.life<=.03)continue;const q=sample(other,now),distance=Math.hypot(nx-q.x,ny-q.y);proximity+=Math.max(0,1-distance/.22)*other.life}

 const lfo=Math.sin(cycle*Math.PI*2*(o.mode==='abyss'?3:5));
 const detune=o.mode==='abyss'?.007:.0045;
 a.b.frequency.setTargetAtTime(fq*(1+detune+lfo*.0015),ctx.currentTime,.12);
 if(a.harmonic)a.harmonic.frequency.setTargetAtTime(fq*(o.mode==='abyss'?4:3),ctx.currentTime,.12);
 a.f.frequency.setTargetAtTime(330+Math.pow(1-ny,1.7)*(o.mode==='abyss'?1550:2300)+lfo*120+interaction*280,ctx.currentTime,.13);

 // DRIFT: near-pure, slowly breathing sustained tone with a barely beating unison.
 a.b.frequency.setTargetAtTime(fq*1.003,ctx.currentTime,.19);
 a.f.frequency.setTargetAtTime(620+Math.pow(1-ny,1.4)*1300+interaction*250,ctx.currentTime,.22);
 const breath=.65+.35*Math.sin((now-o.born)*.001*Math.PI/7);
 a.gain.gain.setTargetAtTime(Math.max(.0001,level*.64*breath),ctx.currentTime,first?.42:.25);
}else if(o.mode==='flow'){
 // FLOW: bright bell-like partial and patterned amplitude pulse; distinct from the drifting pad.
 a.b.frequency.setTargetAtTime(fq*1.5,ctx.currentTime,.055);
 if(a.harmonic)a.harmonic.frequency.setTargetAtTime(fq*3,ctx.currentTime,.07);
 const pulse=.46+.54*Math.pow(Math.max(0,Math.sin((now-o.born)*.001*Math.PI*2*2.5)),3);
 a.f.frequency.setTargetAtTime(1400+Math.pow(1-ny,1.1)*5200+interaction*360,ctx.currentTime,.065);
 a.gain.gain.setTargetAtTime(Math.max(.0001,level*.76*pulse),ctx.currentTime,first?.12:.052);
}else{
 a.b.frequency.setTargetAtTime(fq*2*(1+.003*Math.sin(cycle*6.28)),ctx.currentTime,.11);
 a.f.frequency.setTargetAtTime(520+Math.pow(1-ny,1.55)*2800+interaction*400,ctx.currentTime,.12);

function destroy(o){if(!o.audio||!ctx)return;const t=ctx.currentTime;o.audio.gain.gain.setTargetAtTime(.00001,t,.14);for(const x of [o.audio.a,o.audio.b,o.audio.harmonic])if(x)try{x.stop(t+.85)}catch(e){}o.audio=null}

function sample(o,now){
 const path=o.path;if(!path.length)return{x:.5,y:.5};if(path.length===1)return path[0];

}

function newOrganism(id,x,y){$('center').classList.add('hidden');const o={id:nextOrganismId++,mode,profile:visualProfiles[mode],created:performance.now(),born:performance.now(),released:0,active:true,path:[],life:1,audio:null};addPoint(o,x,y);organisms.push(o);playingTouches.set(id,{o,x,y,t:performance.now()});retireOldest();createAudio(o);$('status').textContent='LIVE · '+organisms.length+' ORGANISM'+(organisms.length===1?'':'S')+(ctx?' · AUDIO '+ctx.state.toUpperCase():'');return o}
function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();unlockAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}const o=newOrganism(e.pointerId,e.clientX,e.clientY);updateAudio(o,performance.now(),true)}

}

$('rec').addEventListener('click',()=>{if(recording){stopRecording();return}if(!window.MediaRecorder||!cv.captureStream){toast('EXPORT VIDEO NOT SUPPORTED');return}if(!initAudio())return;ctx.resume();const stream=cv.captureStream(24),audioTracks=mediaDest.stream.getAudioTracks();for(const t of audioTracks)stream.addTrack(t);const kinds=['video/mp4','video/webm;codecs=vp9,opus','video/webm'];const mime=kinds.find(x=>MediaRecorder.isTypeSupported(x))||'';try{const chunks=[];recorder=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{})});recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{if(chunks.length)downloadBlob(new Blob(chunks,{type:mime||recorder.mimeType}),mime||recorder.mimeType);else toast('NO VIDEO RECORDED');stream.getTracks().forEach(t=>t.stop())};recorder.start(1000);recording=true;recordingStart=Date.now();$('rec').classList.add('recording');recTimer=setInterval(()=>{const sec=Math.floor((Date.now()-recordingStart)/1000);$('rec').textContent='■ '+(30-sec)+'s';if(sec>=30)stopRecording()},250);toast('CAPTURING 30s')}catch(e){toast('EXPORT NOT AVAILABLE ON THIS DEVICE')}});

function stampMemory(x,y,power){
 if(!memoryGrid)return;const ix=Math.round(clamp(x/W)*(memoryW-1)),iy=Math.round(clamp(y/H)*(memoryH-1));
 for(let yy=-2;yy<=2;yy++)for(let xx=-2;xx<=2;xx++){const col=ix+xx,row=iy+yy;if(col<0||row<0||col>=memoryW||row>=memoryH)continue;const fall=Math.exp(-(xx*xx+yy*yy)/3.0),idx=row*memoryW+col;memoryGrid[idx]=Math.min(1.7,memoryGrid[idx]+fall*power)}
}
function getMemory(x,y){if(!memoryGrid)return 0;const ix=Math.floor(clamp(x/W)*(memoryW-1)),iy=Math.floor(clamp(y/H)*(memoryH-1));return memoryGrid[iy*memoryW+ix]||0}
function readAudioSpectrum(){
 if(!analyser||!ctx||ctx.state!=='running'){spectrum.bass*=.94;spectrum.mid*=.94;spectrum.high*=.94;spectrum.rms*=.94;spectrum.attack*=.85;return}
 analyser.getByteFrequencyData(frequencyBins);analyser.getByteTimeDomainData(timeBins);
 const hz=ctx.sampleRate/analyser.fftSize;
 const band=(min,max)=>{let sum=0,count=0;for(let i=Math.max(1,Math.floor(min/hz));i<Math.min(frequencyBins.length,Math.ceil(max/hz));i++){sum+=frequencyBins[i]/255;count++}return count?sum/count:0};
 const bass=band(40,180),mid=band(180,2000),high=band(2000,8000);
 let sq=0;for(let i=0;i<timeBins.length;i+=4){const v=(timeBins[i]-128)/128;sq+=v*v}const rms=Math.sqrt(sq/(timeBins.length/4));

}
function drawLayer(now,layer,positions){
 const t=now*.001,z=layer===0?.53:layer===1?1:1.5;
